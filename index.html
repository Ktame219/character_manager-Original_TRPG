<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ネジクレネジマキ キャラ管理</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<style>
:root{
  --ac:#534AB7;--acd:#3C3489;--acl:#EEEDFE;--dng:#E24B4A;--dngb:#FCEBEB;
  --font-sans:'Noto Sans JP',system-ui,-apple-system,sans-serif;
  --color-text-primary:#1a1a1a;
  --color-text-secondary:#6b7280;
  --color-text-tertiary:#9ca3af;
  --color-background-primary:#ffffff;
  --color-background-secondary:#f9fafb;
  --color-border-secondary:#e5e7eb;
  --color-border-tertiary:#f3f4f6;
  --border-radius-md:8px;
  --border-radius-lg:12px;
}
@media(prefers-color-scheme:dark){
  :root{
    --color-text-primary:#f9fafb;
    --color-text-secondary:#9ca3af;
    --color-text-tertiary:#6b7280;
    --color-background-primary:#1f2937;
    --color-background-secondary:#111827;
    --color-border-secondary:#374151;
    --color-border-tertiary:#2d3748;
    --acl:#2d2a5e;
  }
}
body{background:var(--color-background-secondary);min-height:100vh;}
.page{max-width:720px;margin:0 auto;}
*{box-sizing:border-box;margin:0;padding:0}
:root{--ac:#534AB7;--acd:#3C3489;--acl:#EEEDFE;--dng:#E24B4A;--dngb:#FCEBEB}
.page{padding:0 0 2rem;font-family:var(--font-sans)}
.topbar{display:flex;align-items:center;gap:10px;padding:1rem 0 1.25rem;border-bottom:0.5px solid var(--color-border-tertiary);margin-bottom:1.5rem}
.topbar h1{font-size:17px;font-weight:500;color:var(--color-text-primary);flex:1}
.btn{cursor:pointer;font-family:var(--font-sans);font-size:13px;padding:6px 14px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:var(--color-background-secondary)}
.btn.ac{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn.ac:hover{background:var(--acd)}
.btn.dng{border-color:var(--dng);color:var(--dng)}
.btn.dng:hover{background:var(--dngb)}
.btn.sm{font-size:12px;padding:4px 10px}
.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:1rem}
.ccard{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;cursor:pointer}
.ccard:hover{border-color:var(--color-border-secondary)}
.ccard-img{width:100%;height:120px;background:var(--color-background-secondary);display:flex;align-items:center;justify-content:center;color:var(--color-text-tertiary);font-size:30px;overflow:hidden}
.ccard-img img{width:100%;height:100%;object-fit:cover}
.ccard-body{padding:10px 12px}
.ccard-name{font-size:15px;font-weight:500;color:var(--color-text-primary);margin-bottom:2px}
.ccard-sub{font-size:12px;color:var(--color-text-secondary);line-height:1.6}
.ccard-ko{font-size:11px;color:var(--dng);font-weight:500;margin-top:3px}
.new-ccard{border:0.5px dashed var(--color-border-tertiary);border-radius:var(--border-radius-lg);min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--color-text-secondary);font-size:13px}
.new-ccard:hover{border-color:var(--color-border-secondary);background:var(--color-background-secondary)}
.sheet{display:none}.sheet.on{display:block}
.sec{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);margin-bottom:10px;overflow:hidden}
.sec-t{font-size:12px;font-weight:500;color:var(--color-text-secondary);margin-bottom:10px}.sec-header{display:flex;align-items:center;justify-content:space-between;padding:0.6rem 1.25rem;cursor:pointer;user-select:none}.sec-header:hover{background:var(--color-background-secondary)}.sec.no-collapse .sec-header{cursor:default}.sec.no-collapse .sec-header:hover{background:transparent}.sec-toggle{font-size:14px;color:var(--color-text-tertiary);transition:transform .2s}.sec-toggle.open{transform:rotate(180deg)}.sec-body{padding:0 1.25rem 1rem}.sec-body.collapsed{display:none}
.row{display:grid;gap:8px;margin-bottom:8px}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1fr 1fr 1fr}
.fg{display:flex;flex-direction:column;gap:4px}
.fl{font-size:11px;color:var(--color-text-secondary)}
input[type=text],input[type=number],textarea{width:100%;padding:6px 8px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);font-family:var(--font-sans);font-size:13px;resize:none}
input:focus,textarea:focus{outline:none;border-color:var(--ac)}
.hex-row{display:flex;flex-wrap:wrap;gap:4px}
.hb{width:30px;height:30px;border-radius:4px;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);cursor:pointer;font-size:11px;font-weight:500;color:var(--color-text-secondary);display:flex;align-items:center;justify-content:center}
.hb.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.ko-wrap{display:flex;align-items:center;gap:8px;padding:6px 0}
.ko-wrap input[type=checkbox]{width:16px;height:16px;accent-color:var(--dng);cursor:pointer}
.ko-wrap label{font-size:13px;font-weight:500;cursor:pointer;color:var(--color-text-primary)}
.ko-wrap.ko label{color:var(--dng)}
.sk-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sk-grid.c3{grid-template-columns:1fr 1fr 1fr}
.sk-card{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:10px 12px;cursor:pointer;position:relative}
.sk-card:hover{border-color:var(--color-border-secondary)}
.sk-card.sel{border:2px solid var(--ac);background:var(--color-background-secondary)}
.sk-card input[type=radio]{position:absolute;opacity:0;width:0;height:0}
.sk-chk{position:absolute;top:8px;right:8px;width:16px;height:16px;border-radius:50%;background:var(--ac);display:none;align-items:center;justify-content:center}
.sk-card.sel .sk-chk{display:flex}
.sk-name{font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:5px}
.sk-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.tag{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--color-background-secondary);color:var(--color-text-secondary);border:0.5px solid var(--color-border-tertiary)}
.tag.ac{background:var(--acl);color:var(--ac);border-color:#AFA9EC}
.sk-card.sel .tag{background:var(--color-background-primary)}
.sk-eff{font-size:11px;color:var(--color-text-secondary);line-height:1.6}
.clan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.clan-opt input[type=radio]{display:none}
.clan-opt label{display:block;text-align:center;padding:6px 4px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);font-size:12px;cursor:pointer;color:var(--color-text-primary)}
.clan-opt input:checked+label{background:var(--ac);color:#fff;border-color:var(--ac)}
.clan-opt label:hover{background:var(--color-background-secondary)}
.kiz-row{display:grid;grid-template-columns:1fr auto 46px 24px;gap:6px;align-items:center;margin-bottom:6px}
.kiz-t input[type=radio]{display:none}
.kiz-t{display:flex;gap:3px}
.kiz-t input+label{font-size:11px;cursor:pointer;padding:2px 6px;border-radius:20px;border:0.5px solid var(--color-border-tertiary);color:var(--color-text-secondary)}
.kiz-t input:checked+label{background:var(--ac);color:#fff;border-color:var(--ac)}
.kiz-t input.teki:checked+label{background:#D85A30;border-color:#D85A30}
.del-btn{width:22px;height:22px;padding:0;display:flex;align-items:center;justify-content:center;border:none;background:transparent;color:var(--color-text-tertiary);cursor:pointer;font-size:13px}
.del-btn:hover{color:var(--dng)}
.avatar-wrap{width:96px;height:124px;border-radius:var(--border-radius-lg);border:0.5px solid var(--color-border-tertiary);overflow:hidden;flex-shrink:0;background:var(--color-background-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.avatar-wrap img{width:100%;height:100%;object-fit:cover}
.avatar-wrap .ov{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;color:#fff;font-size:22px}
.avatar-wrap:hover .ov{opacity:1}
.d66-box{background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;margin-bottom:10px}
.d66-title{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.d66-panel{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-primary);padding:10px 12px;margin-top:10px;display:none}
.d66-panel.show{display:block}
.d66-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.d66-label{font-size:11px;color:var(--color-text-secondary);min-width:56px}
.d66-val{font-size:14px;font-weight:500;color:var(--color-text-primary);flex:1}
.d66-apply{font-size:11px;padding:3px 8px;border-radius:20px;cursor:pointer;background:var(--acl);color:var(--ac);border:0.5px solid #AFA9EC;font-family:var(--font-sans)}
.d66-apply:hover{background:#CECBF6}
.rig-step{margin-bottom:10px}
.rig-step-title{font-size:11px;color:var(--color-text-secondary);margin-bottom:6px;font-weight:500}
.word-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.wchip{padding:4px 10px;border-radius:20px;border:0.5px solid var(--color-border-tertiary);font-size:13px;cursor:pointer;color:var(--color-text-primary);background:var(--color-background-primary)}
.wchip:hover{border-color:var(--color-border-secondary);background:var(--color-background-secondary)}
.wchip.picked{background:var(--ac);color:#fff;border-color:var(--ac)}
.rig-preview{font-size:15px;font-weight:500;color:var(--ac);margin:8px 0 4px;min-height:22px}
.ok-badge{font-size:12px;color:#1D9E75;display:none;margin-top:4px}
.ok-badge.show{display:block}

/* ===== 閲覧モード ===== */
#vv{display:none}
#vv.on{display:block}

/* ヘッダーヒーロー */
.vw-hero{position:relative;background:var(--ac);border-radius:var(--border-radius-lg);overflow:hidden;margin-bottom:12px;padding:1.25rem 1.25rem 1rem}
.vw-hero::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,0,0,.35) 0%,transparent 60%);pointer-events:none}
.vw-hero-inner{position:relative;display:flex;gap:14px;align-items:flex-end}
.vw-avatar{width:88px;height:110px;border-radius:10px;overflow:hidden;flex-shrink:0;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);font-size:32px}
.vw-avatar img{width:100%;height:100%;object-fit:cover}
.vw-hero-info{flex:1;min-width:0}
.vw-name{font-size:22px;font-weight:700;color:#fff;line-height:1.2;margin-bottom:3px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.vw-rig{font-size:13px;color:rgba(255,255,255,.8);margin-bottom:6px}
.vw-badges{display:flex;flex-wrap:wrap;gap:5px}
.vw-badge{font-size:11px;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,.18);color:#fff;border:0.5px solid rgba(255,255,255,.3)}
.vw-badge.dng{background:rgba(226,75,74,.7);border-color:rgba(226,75,74,.9)}
.vw-ko-banner{background:var(--dng);color:#fff;font-size:12px;font-weight:700;text-align:center;padding:5px;letter-spacing:.05em;margin-bottom:10px;border-radius:var(--border-radius-md)}

/* クロガネバー */
.vw-kurogane{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:10px 14px;margin-bottom:10px}
.vw-kuro-label{font-size:11px;color:var(--color-text-secondary);margin-bottom:7px;font-weight:500}
.vw-kuro-pips{display:flex;gap:4px;flex-wrap:wrap}
.vw-pip{width:28px;height:28px;border-radius:4px;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:var(--color-text-tertiary)}
.vw-pip.on{background:var(--ac);border-color:var(--ac);color:#fff}

/* セクション共通 */
.vw-sec{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);margin-bottom:10px;overflow:hidden}
.vw-sec-head{font-size:11px;font-weight:500;color:var(--color-text-secondary);padding:7px 14px 0;letter-spacing:.04em;text-transform:uppercase}
.vw-sec-body{padding:8px 14px 12px}

/* バックグラウンド3列 */
.vw-bg-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.vw-bg-item{}
.vw-bg-key{font-size:10px;color:var(--color-text-tertiary);margin-bottom:2px}
.vw-bg-val{font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:3px}
.vw-bg-desc{font-size:11px;color:var(--color-text-secondary);line-height:1.6;white-space:pre-wrap}

/* スキルカード 閲覧用 */
.vw-skill-card{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:10px 12px;background:var(--color-background-secondary)}
.vw-skill-type{font-size:10px;font-weight:500;color:var(--color-text-tertiary);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.vw-skill-name{font-size:15px;font-weight:700;color:var(--color-text-primary);margin-bottom:6px}
.vw-skill-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.vw-skill-eff{font-size:12px;color:var(--color-text-secondary);line-height:1.7}

/* 因縁テーブル */
.vw-kiz-table{width:100%;border-collapse:collapse}
.vw-kiz-table th{font-size:10px;color:var(--color-text-tertiary);font-weight:500;padding:0 6px 6px;text-align:left}
.vw-kiz-table td{font-size:13px;padding:5px 6px;border-top:0.5px solid var(--color-border-tertiary);color:var(--color-text-primary);vertical-align:middle}
.vw-kiz-type{display:inline-block;font-size:10px;padding:1px 7px;border-radius:20px;font-weight:500}
.vw-kiz-type.kizuna{background:var(--acl);color:var(--ac);border:0.5px solid #AFA9EC}
.vw-kiz-type.teki{background:#FDEAE5;color:#D85A30;border:0.5px solid #F4B49E}
.vw-kiz-pts{font-size:13px;font-weight:500;color:var(--color-text-primary);text-align:right}

/* メモ */
.vw-memo{font-size:13px;color:var(--color-text-primary);line-height:1.8;white-space:pre-wrap}

/* 基本情報グリッド */
.vw-info-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.vw-info-item{}
.vw-info-key{font-size:10px;color:var(--color-text-tertiary);margin-bottom:2px}
.vw-info-val{font-size:13px;color:var(--color-text-primary);font-weight:500}

/* クラン情報 */
.vw-clan-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vw-clan-chip{font-size:12px;font-weight:500;padding:3px 10px;border-radius:20px;background:var(--ac);color:#fff}
.vw-clan-rank{font-size:12px;color:var(--color-text-secondary)}

@media(prefers-color-scheme:dark){
  .vw-kiz-type.kizuna{background:#2d2a5e}
  .vw-kiz-type.teki{background:#3d1f15;color:#F4A07A;border-color:#7a3520}
}

/* ===== GitHub / Gist連携 ===== */
.gh-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);margin-bottom:12px;flex-wrap:wrap}
.gh-bar-info{flex:1;min-width:0;font-size:12px;color:var(--color-text-secondary)}
.gh-bar-info strong{color:var(--color-text-primary);font-size:13px}
.gh-avatar{width:24px;height:24px;border-radius:50%;border:0.5px solid var(--color-border-secondary)}
#gh-account:hover{opacity:.75}
.gist-share-box{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:10px 12px;margin-top:10px}
.gist-url-row{display:flex;gap:6px;align-items:center;margin-top:6px}
.gist-url-row input{flex:1;font-size:11px;color:var(--color-text-secondary);background:var(--color-background-primary)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;font-size:13px;padding:8px 18px;border-radius:20px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.import-banner{background:var(--acl);border:0.5px solid #AFA9EC;border-radius:var(--border-radius-lg);padding:10px 14px;margin-bottom:12px;display:none}
.import-banner.show{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.import-banner-info{flex:1;font-size:13px;color:var(--ac)}
.import-banner strong{font-weight:700}
</style>

<div class="page" id="app">
<div id="lv">
  <div class="topbar">
    <h1><i class="ti ti-user" style="font-size:16px;color:var(--ac)" aria-hidden="true"></i> ネジクレネジマキ キャラ管理</h1>
    <!-- 非ログイン時：ログインボタン -->
    <button class="btn sm" id="gh-login-btn" onclick="ghLogin()" style="display:none">
      <i class="ti ti-brand-github" aria-hidden="true"></i> ログイン
    </button>
    <!-- ログイン時：アカウント表示 -->
    <div id="gh-account" style="display:none;align-items:center;gap:8px;cursor:pointer" onclick="ghLogout()">
      <img id="gh-account-avatar" class="gh-avatar" style="width:28px;height:28px">
      <span id="gh-account-name" style="font-size:13px;color:var(--color-text-primary);font-weight:500"></span>
      <i class="ti ti-logout" style="font-size:14px;color:var(--color-text-tertiary)" aria-hidden="true"></i>
    </div>
  </div>

  <!-- GitHubログイン促進バー（非ログイン時のみ） -->
  <div class="gh-bar" id="gh-bar" style="display:none">
    <div class="gh-bar-info">
      <span>GitHubでログインするとキャラを友達と共有できます</span>
    </div>
  </div>

  <!-- Gist共有URLからのインポートバナー -->
  <div class="import-banner" id="import-banner">
    <div class="import-banner-info" id="import-banner-info"></div>
    <button class="btn sm ac" id="import-btn" onclick="importFromGist()"><i class="ti ti-download" aria-hidden="true"></i> 自分のリストに追加</button>
    <button class="btn sm" onclick="dismissImport()">閉じる</button>
  </div>

  <div class="char-grid" id="clist"></div>
</div>

<div id="sv" class="sheet">
  <div class="topbar">
    <button class="btn" onclick="back()"><i class="ti ti-arrow-left" aria-hidden="true"></i> 一覧</button>
    <h1 id="stitle">キャラクター</h1>
    <button class="btn ac" onclick="savec()"><i class="ti ti-device-floppy" aria-hidden="true"></i> 保存</button>
    <button class="btn dng" onclick="delc()"><i class="ti ti-trash" aria-hidden="true"></i></button>
  </div>

  <div class="d66-box">
    <div class="d66-title"><i class="ti ti-dice" style="font-size:16px;color:var(--ac)" aria-hidden="true"></i> D66 ランダム生成</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn sm d66-btn" id="d66-btn-name" onclick="toggleD66('name',rollName)"><i class="ti ti-dice" aria-hidden="true"></i> 名前</button>
      <button class="btn sm d66-btn" id="d66-btn-rig" onclick="toggleD66('rig',rollRig)"><i class="ti ti-dice" aria-hidden="true"></i> リグ名</button>
      <button class="btn sm d66-btn" id="d66-btn-minou" onclick="toggleD66('bg',()=>rollBG('minou'),'minou')"><i class="ti ti-dice" aria-hidden="true"></i> ミノウエ</button>
      <button class="btn sm d66-btn" id="d66-btn-kikkake" onclick="toggleD66('bg',()=>rollBG('kikkake'),'kikkake')"><i class="ti ti-dice" aria-hidden="true"></i> キッカケ</button>
      <button class="btn sm d66-btn" id="d66-btn-negai" onclick="toggleD66('bg',()=>rollBG('negai'),'negai')"><i class="ti ti-dice" aria-hidden="true"></i> ネガイ</button>
    </div>
    <div id="d66-name" class="d66-panel"></div>
    <div id="d66-rig" class="d66-panel"></div>
    <div id="d66-bg" class="d66-panel"></div>
  </div>

  <div class="sec no-collapse">

function d6(){return Math.ceil(Math.random()*6);}
function d66roll(){const a=d6(),b=d6();return{roll:a*10+b,a,b};}
function lookup(tbl,roll){
  if(tbl[roll])return tbl[roll];
  const keys=Object.keys(tbl).map(Number).sort((a,b)=>a-b);
  for(const k of keys)if(k>=roll)return tbl[k];
  return tbl[keys[keys.length-1]];
}

    if(k==='name'&&activePanel==='name')isActive=true;
    else if(k==='rig'&&activePanel==='rig')isActive=true;
    else if((k==='minou'||k==='kikkake'||k==='negai')&&activePanel==='bg'&&activeBgKey===k)isActive=true;
    btn.classList.toggle('ac',isActive);
  });
}

function toggleD66(panelKey,rollFn,bgKey){

  ['d66-name','d66-rig','d66-bg'].forEach(i=>document.getElementById(i).className='d66-panel');
  if(isSame){
    d66ActivePanel=null;d66ActiveBgKey=null;
    updateD66BtnStyles(null,null);
    return;
  }
  d66ActivePanel=panelKey;d66ActiveBgKey=bgKey||null;
  updateD66BtnStyles(panelKey,bgKey);
  rollFn();
}

function renderRigPanel(){
  const el=document.getElementById('d66-rig');
  let h='<div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:10px">各カテゴリからD66で結果を確認し、好きな2つを選んで組み合わせてください</div>';
  RW.forEach((cat,ci)=>{
    const {r,v}=rigRolled[ci];
    const isPicked=rigPicked.includes(ci);
    const isDisabled=!isPicked&&rigPicked.length>=2;
    h+=`<div class="rig-step">
      <div class="rig-step-title">${cat.label}　<span style="font-size:10px;color:var(--color-text-tertiary)">🎲 ${r.a}と${r.b}→${r.roll}</span></div>
      <div class="word-chips">
        <span class="wchip${isPicked?' picked':''}${isDisabled?' disabled':''}" data-ci="${ci}" onclick="toggleRigWord(${ci})">${v}</span>
      </div>
    </div>`;
  });
  const combo=rigPicked.map(ci=>rigRolled[ci]?.v||'').join('');
  h+=`<div class="rig-preview" id="rig-prev">${combo||'単語を2つ選んでください'}</div>`;
  if(combo){
    h+=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
      <button class="d66-apply" onclick="applyF('f-rig','${combo}','d66-rig')">「${combo}」を使う</button>
      <button class="btn sm" onclick="rollRigDirect()"><i class="ti ti-refresh" aria-hidden="true"></i> 振り直す</button>
    </div>`;
  } else {
    h+=`<button class="btn sm" onclick="rollRigDirect()" style="margin-top:4px"><i class="ti ti-refresh" aria-hidden="true"></i> 振り直す</button>`;
  }
  el.innerHTML=h;
}

function rollRigDirect(){
  rigPicked=[];
  rigRolled=RW.map(cat=>{const r=d66roll();return{r,v:lookup(cat.t,r.roll)};});
  renderRigPanel();
}

function toggleRigWord(ci){
  const idx=rigPicked.indexOf(ci);
  if(idx>=0){rigPicked.splice(idx,1);}
  else if(rigPicked.length<2){rigPicked.push(ci);}
  else return;
  renderRigPanel();
}

function fillView(c){

  // 基本情報グリッド

      <div class="vw-bg-key">${k}</div>

          <div class="vw-skill-name">${esc(sk.name)}</div>
          <div class="vw-skill-tags">
            <span class="tag">⏱ ${esc(sk.timing)}</span>
            <span class="tag ac">${esc(sk.limit)}</span>
          </div>
          <div class="vw-skill-eff">${esc(sk.effect)}</div>
        </div>`;

          <span class="tag">⏱ ${esc(sk.timing)}</span>
          <span class="tag ac">${esc(sk.limit)}</span>
        </div>
        <div class="vw-skill-eff">${esc(sk.effect)}</div>

  kizSec.style.display=kizList.length?'':'none';

      <td class="vw-kiz-pts">${k.points||'—'}</td>

  // メモ

  memoSec.style.display=c.memo?'':'none';

function esc(s){
  if(!s&&s!==0)return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ===== GitHub OAuth / Gist連携 ===== */
const GH_CLIENT_ID='Ov23lisEudc0abg7t2ik';
const GH_SCOPE='gist';
const GH_REDIRECT=location.origin+'/callback';

let ghToken=localStorage.getItem('gh_token')||null;
let ghUser=null;
let pendingGistId=null; // URLから読み込んだGist ID

// トースト通知
function toast(msg,ms=2200){
  let el=document.getElementById('_toast');
  if(!el){el=document.createElement('div');el.id='_toast';el.className='toast';document.body.appendChild(el);}
  el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),ms);
}

// GitHubログイン開始
function ghLogin(){
  const state=Math.random().toString(36).slice(2);
  sessionStorage.setItem('gh_state',state);
  location.href=`https://github.com/login/oauth/authorize?client_id=${GH_CLIENT_ID}&scope=${GH_SCOPE}&state=${state}&redirect_uri=${encodeURIComponent(GH_REDIRECT)}`;
}

// GitHubログアウト
function ghLogout(){
  if(!confirm(ghUser?.login+' からログアウトしますか？'))return;
  ghToken=null;ghUser=null;
  localStorage.removeItem('gh_token');
  renderGhBar();
  toast('ログアウトしました');
}

// コールバック処理（?code=...が付いているとき）
async function handleOAuthCallback(){
  const params=new URLSearchParams(location.search);
  const code=params.get('code');
  const state=params.get('state');
  if(!code)return false;
  // stateチェック
  if(state&&state!==sessionStorage.getItem('gh_state')){
    toast('認証エラー（state不一致）');
    history.replaceState({},'',location.pathname);
    return true;
  }
  sessionStorage.removeItem('gh_state');
  toast('ログイン中…',4000);
  try{
    const res=await fetch('https://nejikure-token.kaitototamenobu.workers.dev',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code}),
    });
    const data=await res.json();
    if(data.access_token){
      ghToken=data.access_token;
      localStorage.setItem('gh_token',ghToken);
      toast('ログインしました！');
    } else {
      toast('ログインに失敗しました');
    }
  } catch(e){
    toast('通信エラー: '+e.message);
  }
  history.replaceState({},'',location.pathname+(pendingGistId?'?gist='+pendingGistId:''));
  return true;
}

// GitHubユーザー情報を取得
async function fetchGhUser(){
  if(!ghToken)return null;
  try{
    const res=await fetch('https://api.github.com/user',{headers:{Authorization:'token '+ghToken}});
    if(res.status===401){ghToken=null;localStorage.removeItem('gh_token');return null;}
    return await res.json();
  } catch{return null;}
}

// ログインバーの描画
function renderGhBar(){
  const loginBtn=document.getElementById('gh-login-btn');
  const accountEl=document.getElementById('gh-account');
  const ghBar=document.getElementById('gh-bar');
  const shareBtn=document.getElementById('vw-share-btn');

  if(ghUser){
    // ログイン時：アカウント表示、ログイン促進バー非表示
    loginBtn.style.display='none';
    accountEl.style.display='flex';
    document.getElementById('gh-account-avatar').src=ghUser.avatar_url;
    document.getElementById('gh-account-name').textContent=ghUser.login;
    ghBar.style.display='none';
    if(shareBtn)shareBtn.style.display='';
  } else {
    // 非ログイン時：ログインボタン表示、ログイン促進バー表示
    loginBtn.style.display='';
    accountEl.style.display='none';
    ghBar.style.display='';
    if(shareBtn)shareBtn.style.display='none';
  }
}

// Gistにキャラを共有
async function shareToGist(){
  if(!ghToken){toast('先にGitHubでログインしてください');return;}
  const c=chars[cid];
  if(!c){return;}
  const btn=document.getElementById('vw-share-btn');
  btn.disabled=true;btn.innerHTML='<i class="ti ti-loader" aria-hidden="true"></i> 共有中…';

  // 既存GistIDがあれば更新、なければ新規作成
  const existingGistId=c._gistId||null;
  const payload={
    description:`ネジクレネジマキ キャラクター: ${c.name||'名無し'}`,
    public:false, // secret gist
    files:{
      'character.json':{content:JSON.stringify({...c,_gistId:undefined},null,2)},
      'meta.json':{content:JSON.stringify({appVersion:'v10',createdBy:ghUser?.login,updatedAt:new Date().toISOString()},null,2)},
    },
  };

  try{
    let res,data;
    if(existingGistId){
      res=await fetch(`https://api.github.com/gists/${existingGistId}`,{
        method:'PATCH',
        headers:{Authorization:'token '+ghToken,'Content-Type':'application/json'},
        body:JSON.stringify(payload),
      });
    } else {
      res=await fetch('https://api.github.com/gists',{
        method:'POST',
        headers:{Authorization:'token '+ghToken,'Content-Type':'application/json'},
        body:JSON.stringify(payload),
      });
    }
    data=await res.json();
    if(data.id){
      // GistIDをキャラデータに保存
      chars[cid]._gistId=data.id;
      await store();
      const shareUrl=`${location.origin}?gist=${data.id}`;
      // 共有URLをクリップボードにコピー
      try{await navigator.clipboard.writeText(shareUrl);}catch{}
      // 共有URLを閲覧モードに表示
      showShareUrl(shareUrl,data.id);
      toast('共有URLをコピーしました！');
    } else {
      toast('共有に失敗しました: '+(data.message||'不明なエラー'));
    }
  } catch(e){
    toast('通信エラー: '+e.message);
  }
  btn.disabled=false;btn.innerHTML='<i class="ti ti-share" aria-hidden="true"></i> 共有';
}

// 共有URL表示ボックス
function showShareUrl(url,gistId){
  // 既存ボックスがあれば削除
  const old=document.getElementById('vw-share-box');if(old)old.remove();
  const box=document.createElement('div');
  box.id='vw-share-box';box.className='gist-share-box';
  box.innerHTML=`<div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:4px"><i class="ti ti-link" aria-hidden="true"></i> 共有URL（Secret Gist）</div>
    <div class="gist-url-row">
      <input type="text" class="field" value="${url}" readonly onclick="this.select()">
      <button class="btn sm ac" onclick="navigator.clipboard.writeText('${url}').then(()=>toast('コピーしました'))"><i class="ti ti-copy" aria-hidden="true"></i></button>
    </div>
    <div style="font-size:11px;color:var(--color-text-tertiary);margin-top:5px">URLを知っている人だけが閲覧できます</div>`;
  // 閲覧モードのKOバナーの前に挿入
  const vv=document.getElementById('vv');
  const banner=document.getElementById('vw-ko-banner');
  vv.insertBefore(box,banner);
}

// GistからキャラをインポートURL読み込み
async function loadGistFromUrl(){
  const params=new URLSearchParams(location.search);
  const gistId=params.get('gist');
  if(!gistId)return;
  pendingGistId=gistId;
  try{
    const res=await fetch(`https://api.github.com/gists/${gistId}`);
    if(!res.ok){toast('Gistの読み込みに失敗しました');return;}
    const data=await res.json();
    const fileContent=data.files?.['character.json']?.content;
    if(!fileContent){toast('キャラデータが見つかりませんでした');return;}
    const charData=JSON.parse(fileContent);
    charData._gistId=gistId; // GistIDを保持
    // インポートバナーを表示
    const banner=document.getElementById('import-banner');
    const info=document.getElementById('import-banner-info');
    info.innerHTML=`<strong>${esc(charData.name||'名無し')}</strong> が共有されています`;
    banner.classList.add('show');
    // プレビュー用に一時的に閲覧モードで表示
    const tempId='_preview_'+gistId;
    chars[tempId]=charData;
    openView(tempId);
    window._previewId=tempId;
    window._previewData=charData;
  } catch(e){
    toast('読み込みエラー: '+e.message);
  }
}

// インポート確定
async function importFromGist(){
  const data=window._previewData;
  if(!data)return;
  const id=uid();
  chars[id]={...data};
  delete chars[window._previewId];
  window._previewId=null;window._previewData=null;
  await store();
  renderList();
  dismissImport();
  openView(id);
  toast(data.name+'をリストに追加しました！');
}

// インポートバナーを閉じる
function dismissImport(){
  document.getElementById('import-banner').classList.remove('show');
  if(window._previewId){
    delete chars[window._previewId];
    window._previewId=null;window._previewData=null;
  }
  // URLからgistパラメータを除去
  history.replaceState({},'',location.pathname);
  backFromView();
}

// 起動時処理
(async()=>{
  // OAuthコールバック処理
  const wasCallback=await handleOAuthCallback();
  // GistURLからの読み込み
  await loadGistFromUrl();
  // ログイン済みならユーザー情報取得
  if(ghToken){
    ghUser=await fetchGhUser();
  }
  renderGhBar();
})();
</script>
